<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc">
  <rect width="1400" height="1000" rx="28" fill="#f6f8f5"/>
  <svg x="0" y="0" width="1400" height="1000" viewBox="0 0 1400 1780" preserveAspectRatio="xMidYMid meet">
<title id="title">Pulse Guard citizen safety and reporting journey</title>
  <desc id="desc">A decision flow from opening Pulse Guard through new or returning user paths, danger-zone checks, and reporting a crime in progress with video or audio and GPS location.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#35572a"/></marker>
    <style>
      .bg{fill:#f6f8f5}.title{font:700 32px system-ui,sans-serif;fill:#244617}.sub{font:16px system-ui,sans-serif;fill:#58675f}
      .line{fill:none;stroke:#35572a;stroke-width:3;marker-end:url(#arrow);stroke-linecap:round;stroke-linejoin:round}
      .box{fill:#fff;stroke:#56C218;stroke-width:2}.action{fill:#f1f8ed;stroke:#56C218;stroke-width:2}.decision{fill:#fff7df;stroke:#bb8b25;stroke-width:2}
      .start{fill:#56C218;stroke:#3e9011;stroke-width:2}.text{font:600 19px system-ui,sans-serif;fill:#17231f;text-anchor:middle}.small{font:15px system-ui,sans-serif;fill:#53645b;text-anchor:middle}.white{fill:#17310f}.tag{font:700 15px system-ui,sans-serif;fill:#56C218}
    </style>
  </defs>
  <rect class="bg" width="1400" height="1780" rx="28"/>
  <text class="title" x="700" y="48" text-anchor="middle">Citizen safety and reporting journey</text>
  <text class="sub" x="700" y="76" text-anchor="middle">Pulse Guard · Trello stories #8, #93, #94, #95</text>

  <path class="line" d="M700 152 V195"/>
  <path class="line" d="M520 255 H255 V390"/>
  <path class="line" d="M880 255 H1145 V390"/>
  <path class="line" d="M255 490 V520 H560 V545"/>
  <path class="line" d="M1145 490 V520 H840 V545"/>
  <path class="line" d="M700 617 V655"/>
  <path class="line" d="M520 715 H255 V835"/>
  <path class="line" d="M880 715 H1090 V960 H700 V1025"/>
  <path class="line" d="M255 930 V975 H700 V1025"/>
  <path class="line" d="M520 1085 H255 V1205"/>
  <path class="line" d="M880 1085 H1145 V1205"/>
  <path class="line" d="M1145 1315 V1360"/>
  <path class="line" d="M1145 1445 V1490"/>
  <path class="line" d="M1145 1590 V1640"/>
  <text class="tag" x="335" y="240">NEW USER</text>
  <text class="tag" x="1020" y="240">RETURNING USER</text>
  <text class="tag" x="335" y="700">YES</text>
  <text class="tag" x="910" y="700">NO</text>
  <text class="tag" x="335" y="1070">NO</text>
  <text class="tag" x="955" y="1070">YES</text>

  <rect class="start" x="560" y="82" width="280" height="70" rx="35"/>
  <text class="text white" x="700" y="125">Open Pulse Guard</text>

  <polygon class="decision" points="700,195 880,255 700,315 520,255"/>
  <text class="text" x="700" y="250"><tspan x="700">New or returning</tspan><tspan x="700" dy="24">user?</tspan></text>

  <rect class="box" x="60" y="390" width="390" height="100" rx="18"/>
  <text class="text" x="255" y="430"><tspan x="255">New-user flow</tspan><tspan class="small" x="255" dy="25">Trello #93 · details to confirm</tspan></text>
  <rect class="box" x="950" y="390" width="390" height="100" rx="18"/>
  <text class="text" x="1145" y="430"><tspan x="1145">Returning-user flow</tspan><tspan class="small" x="1145" dy="25">Trello #94 · details to confirm</tspan></text>

  <rect class="action" x="560" y="545" width="280" height="72" rx="18"/>
  <text class="text" x="700" y="589">Signed-in user</text>

  <polygon class="decision" points="700,655 880,715 700,775 520,715"/>
  <text class="text" x="700" y="710"><tspan x="700">Check danger zones</tspan><tspan x="700" dy="24">before leaving?</tspan></text>

  <rect class="action" x="60" y="835" width="390" height="95" rx="18"/>
  <text class="text" x="255" y="875"><tspan x="255">Review danger zones</tspan><tspan class="small" x="255" dy="24">Trello #95</tspan></text>

  <polygon class="decision" points="700,1025 880,1085 700,1145 520,1085"/>
  <text class="text" x="700" y="1080"><tspan x="700">Crime in</tspan><tspan x="700" dy="24">progress?</tspan></text>
  <rect class="box" x="60" y="1205" width="390" height="90" rx="18"/>
  <text class="text" x="255" y="1240"><tspan x="255">Continue using</tspan><tspan x="255" dy="24">the app</tspan></text>
  <rect class="action" x="950" y="1205" width="390" height="110" rx="18"/>
  <text class="text" x="1145" y="1245"><tspan x="1145">Tap + and start live video</tspan><tspan x="1145" dy="25">or audio recording</tspan><tspan class="small" x="1145" dy="22">Trello #8</tspan></text>
  <rect class="action" x="950" y="1360" width="390" height="85" rx="18"/>
  <text class="text" x="1145" y="1410">Capture GPS location</text>
  <rect class="action" x="950" y="1490" width="390" height="100" rx="18"/>
  <text class="text" x="1145" y="1530"><tspan x="1145">Send recording and location</tspan><tspan x="1145" dy="25">to nearest police or security</tspan></text>
  <rect class="start" x="950" y="1640" width="390" height="80" rx="18"/>
  <text class="text white" x="1145" y="1688">Confirm report was sent</text>
  </svg>
</svg>
