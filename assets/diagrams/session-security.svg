<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc">
  <rect width="1400" height="1000" rx="28" fill="#f6f8f5"/>
  <svg x="0" y="0" width="1400" height="1000" viewBox="0 0 1200 1060" preserveAspectRatio="xMidYMid meet">
<title id="title">Pulse Guard session security decision flow</title>
  <desc id="desc">A protected screen checks whether a token is valid. Valid tokens continue; expired or invalid tokens lead to sign-in, error retry, or a new token and restored context. Manual logout ends the session.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#35572a"/></marker>
    <style>
      .bg{fill:#f6f8f5}.title{font:700 32px system-ui,sans-serif;fill:#244617}.sub{font:16px system-ui,sans-serif;fill:#58675f}
      .line{fill:none;stroke:#35572a;stroke-width:3;marker-end:url(#arrow);stroke-linecap:round;stroke-linejoin:round}
      .box{fill:#fff;stroke:#56C218;stroke-width:2}.action{fill:#f1f8ed;stroke:#56C218;stroke-width:2}.decision{fill:#fff7df;stroke:#bb8b25;stroke-width:2}
      .start{fill:#56C218;stroke:#3e9011;stroke-width:2}.text{font:600 19px system-ui,sans-serif;fill:#17231f;text-anchor:middle}.small{font:15px system-ui,sans-serif;fill:#53645b;text-anchor:middle}.white{fill:#17310f}.tag{font:700 15px system-ui,sans-serif;fill:#56C218}
    </style>
  </defs>
  <rect class="bg" width="1200" height="1060" rx="28"/>
  <text class="title" x="600" y="48" text-anchor="middle">Session security</text>
  <text class="sub" x="600" y="76" text-anchor="middle">Session security, token expiry, re-authentication, and logout</text>

  <path class="line" d="M600 152 V200"/>
  <path class="line" d="M510 260 H270 V370"/>
  <path class="line" d="M690 260 H930 V370"/>
  <path class="line" d="M930 450 V510"/>
  <path class="line" d="M750 570 H450 V700"/>
  <path class="line" d="M930 630 V700"/>
  <path class="line" d="M930 780 V820 H600 V840"/>
  <path class="line" d="M450 780 V820 H700 V410 H750"/>
  <path class="line" d="M600 920 V970"/>
  <path class="line" d="M220 660 V700"/>
  <path class="line" d="M380 740 H650 V410 H750"/>
  <path class="line" d="M220 930 V970"/>
  <text class="tag" x="345" y="245">YES</text>
  <text class="tag" x="860" y="245">NO</text>
  <text class="tag" x="595" y="555">NO</text>
  <text class="tag" x="960" y="680">YES</text>

  <rect class="start" x="460" y="82" width="280" height="70" rx="35"/>
  <text class="text white" x="600" y="125">Open protected screen</text>
  <polygon class="decision" points="600,200 780,260 600,320 420,260"/>
  <text class="text" x="600" y="255"><tspan x="600">Token valid and</tspan><tspan x="600" dy="24">not expired?</tspan></text>
  <rect class="action" x="60" y="370" width="390" height="95" rx="18"/>
  <text class="text" x="255" y="410"><tspan x="255">Continue to requested screen</tspan><tspan class="small" x="255" dy="24">Valid session</tspan></text>
  <rect class="box" x="750" y="370" width="360" height="80" rx="18"/>
  <text class="text" x="930" y="418">Redirect to sign-in</text>
  <polygon class="decision" points="930,510 1110,570 930,630 750,570"/>
  <text class="text" x="930" y="565"><tspan x="930">Credentials</tspan><tspan x="930" dy="24">accepted?</tspan></text>
  <rect class="box" x="280" y="700" width="340" height="80" rx="18"/>
  <text class="text" x="450" y="748">Show sign-in error and retry</text>
  <rect class="action" x="750" y="700" width="360" height="80" rx="18"/>
  <text class="text" x="930" y="748">Issue a new token</text>
  <rect class="action" x="420" y="840" width="360" height="80" rx="18"/>
  <text class="text" x="600" y="888">Restore previous context where possible</text>
  <rect class="start" x="460" y="970" width="280" height="70" rx="35"/>
  <text class="text white" x="600" y="1013">Continue</text>
  <rect class="box" x="60" y="580" width="320" height="80" rx="18"/>
  <text class="text" x="220" y="628">Idle timeout</text>
  <rect class="action" x="60" y="700" width="320" height="80" rx="18"/>
  <text class="text" x="220" y="748">Expire token</text>
  <rect class="box" x="60" y="850" width="320" height="80" rx="18"/>
  <text class="text" x="220" y="898">Manual logout</text>
  <rect class="action" x="60" y="970" width="320" height="70" rx="18"/>
  <text class="text" x="220" y="1000"><tspan x="220">End session;</tspan><tspan x="220" dy="22">sign in next time</tspan></text>
  </svg>
</svg>
